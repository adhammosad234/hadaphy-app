<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>هدفي — متابعة الأهداف المالية</title>
<meta name="theme-color" content="#10b981">
<meta name="description" content="تطبيق لمتابعة الأهداف المالية وحساب أرباح العمل اليومي والمدخرات">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%2310b981'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23fff' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='11' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* ============================================================
   هدفي — الأنماط
   ============================================================ */
:root{
  --bg:#eef2f7; --header-bg:rgba(238,242,247,.86);
  --card:#ffffff; --card2:#f6f8fb;
  --text:#0f172a; --muted:#64748b;
  --border:#e3e9f1;
  --primary:#059669; --primary-l:#10b981; --primary-soft:#d7f5e9; --on-primary:#ffffff;
  --accent:#6366f1; --accent-soft:#e4e7ff;
  --danger:#e11d48; --danger-soft:#ffe4e9;
  --warn:#d97706; --warn-soft:#fef3c7;
  --shadow:0 6px 22px rgba(15,23,42,.07);
  --radius:20px;
}
html[data-theme="dark"]{
  --bg:#0a1120; --header-bg:rgba(10,17,32,.86);
  --card:#111c30; --card2:#17233a;
  --text:#e7eefb; --muted:#8ea3c0;
  --border:#22304c;
  --primary:#34d399; --primary-l:#6ee7b7; --primary-soft:#0d3a2c; --on-primary:#04241a;
  --accent:#818cf8; --accent-soft:#1e1b4b;
  --danger:#fb7185; --danger-soft:#3d1220;
  --warn:#fbbf24; --warn-soft:#3b2a08;
  --shadow:0 8px 26px rgba(0,0,0,.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Cairo","Tajawal",system-ui,-apple-system,"Noto Sans Arabic","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.65;
  min-height:100vh;padding-bottom:110px;
  transition:background .25s ease,color .25s ease;
  overflow-x:hidden;
}
h1,h2,h3,h4,p{margin:0}
button{font-family:inherit}
svg{display:block}
.app-header{
  position:sticky;top:0;z-index:40;
  background:var(--header-bg);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:40px;height:40px;border-radius:13px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(5,150,105,.32);
}
.logo svg{width:22px;height:22px}
.brand h1{font-size:17px;font-weight:800;letter-spacing:-.2px}
.brand .tag{font-size:11px;color:var(--muted);margin-top:-3px}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);display:grid;place-items:center;
  cursor:pointer;transition:.18s;
}
.icon-btn:hover{background:var(--card2);transform:translateY(-1px)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn svg{width:18px;height:18px}
.icon-btn.sm svg{width:15px;height:15px}
.view{display:none;padding:16px;max-width:840px;margin:0 auto}
.view.active{display:block;animation:fadeUp .28s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);
}
.card + .card{margin-top:12px}
.card-title{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.eyebrow{font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.2px}
.pos{color:var(--primary)}
.neg{color:var(--danger)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.section-head h3{font-size:15px;font-weight:800}
.link{background:none;border:0;color:var(--primary);font-weight:700;font-size:13px;cursor:pointer;padding:4px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:13px;border:1px solid transparent;
  font-size:14px;font-weight:700;cursor:pointer;transition:.16s;white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 6px 16px rgba(5,150,105,.24)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{background:var(--card2);border-color:var(--border);color:var(--text)}
.btn.ghost:hover{background:var(--card)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.hero{position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;inset:auto -60px -90px auto;width:220px;height:220px;
  background:radial-gradient(circle,var(--primary-soft),transparent 70%);pointer-events:none;
}
.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;position:relative;z-index:1}
.goal-name{font-size:20px;font-weight:800;margin:2px 0}
.ring-wrap{position:relative;width:172px;height:172px;margin:14px auto 6px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--card2);stroke-width:13}
.ring-fg{
  fill:none;stroke:url(#ringGrad);stroke-width:13;stroke-linecap:round;
  transition:stroke-dashoffset .9s cubic-bezier(.22,1,.36,1);
}
#ringGrad stop:first-child{stop-color:var(--primary)}
#ringGrad stop:last-child{stop-color:var(--accent)}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;text-align:center;
}
.ring-center strong{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.ring-center span{font-size:11.5px;color:var(--muted);font-weight:600}
.motiv{
  text-align:center;font-size:13.5px;font-weight:700;color:var(--primary);
  background:var(--primary-soft);border-radius:12px;padding:9px 12px;margin-top:8px;position:relative;z-index:1;
}
.badge-success{
  margin-top:10px;text-align:center;font-size:13px;font-weight:800;
  background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:9px;
}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:13px 14px}
.stat strong{display:block;font-size:17px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.stat .sub{font-size:11px;color:var(--muted)}
.rate-card{display:flex;align-items:center;gap:14px;margin-top:12px}
.rate-card .rc-item{flex:1;display:flex;flex-direction:column;gap:2px}
.rate-card strong{font-size:16px;font-weight:800}
.rate-card strong.big{font-size:26px;line-height:1.1;color:var(--primary)}
.rate-card .divider{width:1px;align-self:stretch;background:var(--border)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.quick .btn{padding:12px 6px;font-size:13px;border-radius:14px}
.list{display:flex;flex-direction:column;gap:8px}
.row-item{
  display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--border);border-radius:15px;
  padding:11px 12px;transition:.16s;
}
.row-item:hover{border-color:var(--primary)}
.ri-ico{
  width:36px;height:36px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  font-weight:800;font-size:17px;
}
.ri-ico.inc{background:var(--primary-soft);color:var(--primary)}
.ri-ico.exp{background:var(--danger-soft);color:var(--danger)}
.ri-main{flex:1;min-width:0}
.ri-title{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-amount{font-size:14px;font-weight:800;white-space:nowrap;letter-spacing:-.2px}
.ri-actions{display:flex;gap:4px}
.empty-msg{text-align:center;padding:26px 10px;color:var(--muted);font-size:13px}
.form{display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--border);
  background:var(--card2);color:var(--text);font-size:15px;font-family:inherit;
  outline:none;transition:.16s;font-weight:600;
}
.field input[type=number],.field input[type=date],.field input[type=time]{direction:ltr;text-align:right}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--card);
}
.field textarea{resize:vertical;min-height:56px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.chip{
  padding:7px 11px;border-radius:10px;border:1px solid var(--border);
  background:var(--card2);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;
}
.chip.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.preview{
  background:var(--primary-soft);color:var(--primary);border-radius:13px;
  padding:11px 14px;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;
}
.preview strong{font-size:18px;font-weight:800}
.modal-actions{display:flex;gap:9px;margin-top:4px}
.modal-actions .btn{flex:1}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.modal-head h3{font-size:16.5px;font-weight:800}
.switch-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;font-size:13.5px;font-weight:700;
}
.switch-row input{width:46px;height:26px;accent-color:var(--primary);cursor:pointer}
#modal-root{position:fixed;inset:0;z-index:100;display:none}
#modal-root.open{display:block}
.modal-backdrop{position:absolute;inset:0;background:rgba(3,8,20,.55);animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-wrap{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.modal{
  background:var(--card);width:100%;max-width:480px;max-height:92vh;overflow-y:auto;
  border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  animation:slideUp .26s cubic-bezier(.22,1,.36,1);box-shadow:0 -10px 40px rgba(0,0,0,.25);
}
@keyframes slideUp{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:640px){
  .modal-wrap{align-items:center;padding:20px}
  .modal{border-radius:24px;max-height:86vh}
}
#toast-root{position:fixed;bottom:96px;left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:13px;
  font-size:13px;font-weight:700;max-width:420px;text-align:center;
  opacity:0;transform:translateY(14px);transition:.28s ease;box-shadow:0 10px 30px rgba(0,0,0,.25);
}
.toast.show{opacity:1;transform:none}
.toast.error{background:var(--danger);color:#fff}
.toast.success{background:var(--primary);color:var(--on-primary)}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--border);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 22px rgba(15,23,42,.06);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:700;
  padding:7px 2px;border-radius:13px;cursor:pointer;transition:.16s;
}
.nav-item svg{width:21px;height:21px}
.nav-item.active{color:var(--primary);background:var(--primary-soft)}
.fab{
  position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:18px;z-index:60;
  width:56px;height:56px;border-radius:19px;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;
  display:grid;place-items:center;box-shadow:0 10px 26px rgba(5,150,105,.4);
  transition:.18s;
}
.fab:hover{transform:translateY(-2px) scale(1.04)}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}
.goal-card{position:relative}
.goal-card.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
.goal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.goal-top h3{font-size:16px;font-weight:800}
.pill{
  font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;
  background:var(--primary-soft);color:var(--primary);
}
.bar{height:9px;background:var(--card2);border-radius:20px;overflow:hidden;margin:11px 0 8px}
.bar > i{
  display:block;height:100%;border-radius:20px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  transition:width .8s cubic-bezier(.22,1,.36,1);
}
.goal-stats{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);font-weight:700}
.goal-stats b{color:var(--text);font-size:12.5px}
.goal-actions{display:flex;gap:7px;margin-top:12px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.filters .field:first-child{grid-column:1/-1}
.chart-wrap{position:relative;width:100%}
canvas{display:block;width:100%}
.empty{text-align:center;padding:34px 18px}
.empty .ico{font-size:44px;margin-bottom:8px}
.empty h3{font-size:17px;font-weight:800;margin-bottom:6px}
.empty p{font-size:13px;color:var(--muted);margin-bottom:16px}
.empty .row{justify-content:center;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800}
.notice{font-size:11.5px;color:var(--muted);background:var(--card2);border-radius:12px;padding:10px 12px;line-height:1.7}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" fill="currentColor"/>
      </svg>
    </div>
    <div>
      <h1>هدفي</h1>
      <div class="tag">متابعة أهدافك المالية</div>
    </div>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="تبديل المظهر"></button>
</header>

<main>
  <section id="view-home" class="view active"></section>
  <section id="view-history" class="view"></section>
  <section id="view-goals" class="view"></section>
  <section id="view-stats" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>

<button class="fab" id="fab" aria-label="إضافة عملية">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<nav class="bottom-nav" id="bottomNav"></nav>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
"use strict";
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const AR_DIGITS = '٠١٢٣٤٥٦٧٨٩', FA_DIGITS = '۰۱۲۳۴۵۶۷۸۹';
function normDigits(s) {
  return String(s).replace(/[٠-٩]/g, d => AR_DIGITS.indexOf(d)).replace(/[۰-۹]/g, d => FA_DIGITS.indexOf(d));
}
function num(v) {
  const n = parseFloat(normDigits(String(v)).replace(/[^\d.-]/g, ''));
  return isFinite(n) ? n : 0;
}
const numFmt = (() => {
  try { return new Intl.NumberFormat('ar-EG-u-nu-latn', { maximumFractionDigits: 2 }); }
  catch (e) { return new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }); }
})();
const money = (piasters) => numFmt.format(Math.round(piasters || 0) / 100);
const cur   = () => (state && state.settings.currency) || 'ج.م';
const dateFmtLong = (() => {
  try { return new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'long', year: 'numeric' }); }
  catch (e) { return { format: d => d.toISOString().slice(0, 10) }; }
})();
const dateFmtShort = (() => {
  try { return new Intl.DateTimeFormat('ar-EG-u-nu-latn', { day: 'numeric', month: 'short' }); }
  catch (e) { return { format: d => d.toISOString().slice(5, 10) }; }
})();
function isoOf(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function todayISO() { return isoOf(new Date()); }
function parseISO(s) { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); }
function fmtDate(iso) { try { return dateFmtLong.format(parseISO(iso)); } catch (e) { return iso; } }
function fmtDateShort(iso) { try { return dateFmtShort.format(parseISO(iso)); } catch (e) { return iso; } }
function addDays(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 86400000); }

const CATEGORIES = [
  { id: 'food',      label: 'طعام',     icon: '🍽️' },
  { id: 'transport', label: 'مواصلات',  icon: '🚌' },
  { id: 'shopping',  label: 'مشتريات',  icon: '🛍️' },
  { id: 'bills',     label: 'فواتير',   icon: '🧾' },
  { id: 'other',     label: 'أخرى',     icon: '📌' }
];
const catOf = (id) => CATEGORIES.find(c => c.id === id) || CATEGORIES[4];

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  goals: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4h12l-2 4 2 4H6"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 20v-6M12 20V6M18 20v-9"/></svg>',
  settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>',

const Store = (() => {
  const DB = 'hadafi-db', STORE = 'kv';
  let dbp = null;
  function openDB() {
    if (dbp) return dbp;
    dbp = new Promise(resolve => {
      try {
        if (!('indexedDB' in window)) return resolve(null);
        const req = indexedDB.open(DB, 1);
        req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
        req.onblocked = () => resolve(null);
        setTimeout(() => resolve(null), 2500);
      } catch (e) { resolve(null); }
    });
    return dbp;
  }
  return {
    async get(key) {
      const db = await openDB();
      if (db) {
        try {
          return await new Promise((res, rej) => {
            const r = db.transaction(STORE, 'readonly').objectStore(STORE).get(key);
            r.onsuccess = () => res(r.result);
            r.onerror = () => rej(r.error);
          });
        } catch (e) {}
      }
      try { const s = localStorage.getItem('hadafi:' + key); return s ? JSON.parse(s) : null; } catch (e) { return null; }
    },
    async set(key, val) {
      const db = await openDB();
      if (db) {
        try {
          await new Promise((res, rej) => {
            const r = db.transaction(STORE, 'readwrite').objectStore(STORE).put(val, key);
            r.onsuccess = () => res();
            r.onerror = () => rej(r.error);
          });
          return true;
        } catch (e) {}
      }
      try { localStorage.setItem('hadafi:' + key, JSON.stringify(val)); return true; } catch (e) { return false; }
    }
  };
})();

function defaultState() {
  return {
    version: 1,
    settings: {
      theme: 'light', currency: 'ج.م', defaultRate: 0,
      reminderEnabled: false, reminderTime: '20:00', lastReminderDate: null, milestones: {}
    },
    goals: [], activeGoalId: null, entries: []
  };
}

let state = defaultState();
let saveTimer = null;
let historyFilter = { q: '', type: 'all', from: '', to: '' };
let statsScope = 'all';

function migrate(raw) {
  const base = defaultState();
  const s = Object.assign(base, raw || {});
  s.settings = Object.assign(base.settings, (raw && raw.settings) || {});
  s.settings.milestones = s.settings.milestones || {};
  s.goals = Array.isArray(raw && raw.goals) ? raw.goals.map(g => ({
    id: g.id || uid(), name: String(g.name || 'هدف'),
    target: Math.max(0, Math.round(Number(g.target) || 0)),
    deadline: g.deadline || null, createdAt: g.createdAt || Date.now()
  })) : [];
  s.entries = Array.isArray(raw && raw.entries) ? raw.entries.map(e => {
    const out = { ...e, id: e.id || uid() };
    out.goalId = out.goalId || null;
    if (out.type === 'work') { out.rate = Math.round(Number(out.rate) || 0); out.days = Number(out.days) || 1; out.bonus = Math.round(Number(out.bonus) || 0); }
    else { out.amount = Math.round(Number(out.amount) || 0); }
    return out;
  }) : [];
  if (!s.activeGoalId || !s.goals.some(g => g.id === s.activeGoalId)) s.activeGoalId = s.goals[0] ? s.goals[0].id : null;
  return s;
}

function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { Store.set('state', state); }, 120);
}
async function persistNow() { clearTimeout(saveTimer); await Store.set('state', state); }

function entryAmount(e) {
  if (e.type === 'work') return Math.round(e.rate * e.days) + (e.bonus || 0);
  return Math.round(e.amount || 0);
}

function computeStats(filterFn) {
  let earnings = 0, expenses = 0, deposits = 0, workDays = 0, workCount = 0;
  for (const e of state.entries) {
    if (filterFn && !filterFn(e)) continue;
    if (e.type === 'work') { earnings += entryAmount(e); workDays += e.days; workCount++; }
    else if (e.type === 'expense') { expenses += e.amount || 0; }
    else if (e.type === 'deposit') { deposits += e.amount || 0; }
  }
  return { earnings, expenses, deposits, workDays, workCount, net: earnings + deposits - expenses };
}
const statsForGoal = (goalId) => computeStats(e => e.goalId === goalId);

function activeGoal() {
  return state.goals.find(g => g.id === state.activeGoalId) || state.goals[0] || null;
}

function currentRate() {
  if (state.settings.defaultRate > 0) return state.settings.defaultRate;
  const g = activeGoal();
  const works = state.entries
    .filter(e => e.type === 'work' && (!g || e.goalId === g.id))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return works.length ? works[0].rate : 0;
}

function goalMetrics(goal) {
  const s = statsForGoal(goal.id);
  const target = goal.target || 0;
  const net = s.net;
  const remaining = Math.max(0, target - net);
  const extra = Math.max(0, net - target);
  const pct = target > 0 ? (net / target) * 100 : 0;
  const rate = currentRate();
  const daysLeft = rate > 0 ? Math.ceil(remaining / rate) : null;
  return { ...s, target, net, remaining, extra, pct, rate, daysLeft };
}

function motivation(pct) {
  if (pct >= 100) return '🎉 مبروك! حققت هدفك المالي.';
  if (pct >= 75)  return '🔥 اقتربت جدًا من تحقيق هدفك!';
  if (pct >= 50)  return '💪 أنت قطعت نصف الطريق!';
  if (pct >= 25)  return '👏 بدأت أول خطوة نحو هدفك، واصل!';
  if (pct > 0)    return '🚀 بدأت أول خطوة نحو هدفك!';
  return '✨ ابدأ اليوم، كل يوم عمل يقرّبك من هدفك.';
}

const dayLabel = (d) => {
  if (d === 1) return 'يوم كامل';
  if (d === 0.75) return '¾ يوم';
  if (d === 0.5) return 'نصف يوم';
  if (d === 0.25) return 'ربع يوم';
  return d + ' يوم';
};

function toast(msg, type = 'info') {
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 320); }, 3200);
}

function notify(title, body) {
  toast(body, 'success');
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body, lang: 'ar', dir: 'rtl', tag: 'hadafi' });
    }
  } catch (e) {}
}

function checkMilestones(goalId) {
  if (!goalId) return;
  const goal = state.goals.find(g => g.id === goalId);
  if (!goal || goal.target <= 0) return;
  const m = goalMetrics(goal);
  const marks = state.settings.milestones[goalId] || (state.settings.milestones[goalId] = {});
  let changed = false;
  [25, 50, 75, 100].forEach(step => {
    if (m.pct >= step && !marks[step]) {
      marks[step] = true; changed = true;
      if (step === 100) notify('مبروك! 🎉', 'لقد حققت هدف «' + goal.name + '» بالكامل.');
      else notify('إنجاز جديد 🎯', 'وصلت إلى ' + step + '% من هدف «' + goal.name + '». استمر!');
    }
  });
  if (changed) persist();
}

function showModal(innerHTML, opts = {}) {
  const root = $('#modal-root');
  root.innerHTML = '<div class="modal-backdrop"></div><div class="modal-wrap"><div class="modal">' + innerHTML + '</div></div>';
  root.classList.add('open');
  document.body.style.overflow = 'hidden';
  const close = () => {
    root.classList.remove('open'); root.innerHTML = ''; document.body.style.overflow = '';
    document.removeEventListener('keydown', onKey);
  };
  function onKey(ev) { if (ev.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  root.querySelector('.modal-backdrop').onclick = close;
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  if (opts.onMount) opts.onMount(root, close);
  return close;
}

function entryRowHTML(e, withActions) {
  const amt = entryAmount(e);
  const isExp = e.type === 'expense';
  let title, meta;
  if (e.type === 'work') {
    title = 'يوم عمل · ' + dayLabel(e.days);
    meta = fmtDate(e.date) + ' • ' + money(e.rate) + ' لليوم' + (e.bonus ? ' + مكافأة ' + money(e.bonus) : '');
  } else if (e.type === 'deposit') {
    title = 'إيداع إضافي'; meta = fmtDate(e.date);
  } else {
    title = 'مصروف · ' + catOf(e.category).label; meta = fmtDate(e.date);
  }
  if (e.note) meta += ' • ' + esc(e.note);
  return '<div class="row-item">' +
    '<div class="ri-ico ' + (isExp ? 'exp' : 'inc') + '">' + (isExp ? '−' : '+') + '</div>' +
    '<div class="ri-main"><div class="ri-title">' + esc(title) + '</div><div class="ri-meta">' + meta + '</div></div>' +
    '<div class="ri-amount ' + (isExp ? 'neg' : 'pos') + '">' + (isExp ? '−' : '+') + money(amt) + '</div>' +
    (withActions ? '<div class="ri-actions"><button class="icon-btn sm" data-edit="' + e.id + '" title="تعديل">' + ICON.edit + '</button><button class="icon-btn sm" data-del="' + e.id + '" title="حذف">' + ICON.trash + '</button></div>' : '') +
  '</div>';
}

function filteredEntries() {
  const q = historyFilter.q.trim().toLowerCase();
  const type = historyFilter.type;
  const from = historyFilter.from;
  const to = historyFilter.to;
  return state.entries.filter(e => {
    if (type !== 'all' && e.type !== type) return false;
    if (from && (e.date || '') < from) return false;
    if (to && (e.date || '') > to) return false;
    if (q) {
      const goal = state.goals.find(g => g.id === e.goalId);
      const hay = [e.note || '', goal ? goal.name : '', e.type === 'expense' ? catOf(e.category).label : '', e.type === 'work' ? 'عمل يوم' : (e.type === 'deposit' ? 'إيداع' : 'مصروف'), e.date || '', String(entryAmount(e) / 100)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0));
}

  const el = $('#view-history');
  const list = filteredEntries();
  const totalIn = list.reduce((s, e) => s + (e.type === 'expense' ? 0 : entryAmount(e)), 0);
  const totalOut = list.reduce((s, e) => s + (e.type === 'expense' ? e.amount : 0), 0);
  el.innerHTML =
    '<div class="card"><div class="filters">' +
        '<label class="field">بحث<input id="fq" type="search" placeholder="ابحث في الملاحظات أو الهدف..." value="' + esc(historyFilter.q) + '"></label>' +

          '<option value="all"' + (historyFilter.type === 'all' ? ' selected' : '') + '>كل العمليات</option>' +
          '<option value="work"' + (historyFilter.type === 'work' ? ' selected' : '') + '>أيام العمل</option>' +
          '<option value="expense"' + (historyFilter.type === 'expense' ? ' selected' : '') + '>المصروفات</option>' +
          '<option value="deposit"' + (historyFilter.type === 'deposit' ? ' selected' : '') + '>الإيداعات</option>' +
        '</select></label>' +
        '<label class="field">من تاريخ<input id="ffrom" type="date" value="' + esc(historyFilter.from) + '"></label>' +
        '<label class="field">إلى تاريخ<input id="fto" type="date" value="' + esc(historyFilter.to) + '"></label>' +
      '</div>' +

        '<span class="small muted">' + list.length + ' عملية</span>' +
        '<span class="small"><b class="pos">+' + money(totalIn) + '</b> / <b class="neg">−' + money(totalOut) + '</b></span>' +
      '</div></div>' +
    '<div class="section-head"><h3>سجل العمليات</h3><button class="link" id="clearFilters">إعادة ضبط الفلاتر</button></div>' +
    '<div class="list" id="historyList">' + (list.length ? list.map(e => entryRowHTML(e, true)).join('') : '<div class="empty-msg">لا توجد عمليات مطابقة للبحث.</div>') + '</div>';
  const fq = $('#fq'), ftype = $('#ftype'), ffrom = $('#ffrom'), fto = $('#fto');
  let t = null;
  fq.addEventListener('input', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      historyFilter.q = fq.value; renderHistory();
      const n = $('#fq'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }
    }, 250);
  });
  ftype.onchange = () => { historyFilter.type = ftype.value; renderHistory(); };
  ffrom.onchange = () => { historyFilter.from = ffrom.value; renderHistory(); };
  fto.onchange = () => { historyFilter.to = fto.value; renderHistory(); };
  $('#clearFilters').onclick = () => { historyFilter = { q: '', type: 'all', from: '', to: '' }; renderHistory(); };
  bindEntryActions($('#historyList'));
}

function bindEntryActions(container) {
  if (!container) return;
  container.querySelectorAll('[data-edit]').forEach(btn => {
    btn.onclick = () => {
      const e = state.entries.find(x => x.id === btn.dataset.edit);
      if (!e) return;
      if (e.type === 'work') openWorkForm(e);
      else if (e.type === 'expense') openExpenseForm(e);
      else openDepositForm(e);
    };
  });
  container.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = () => {
      const e = state.entries.find(x => x.id === btn.dataset.del);
      if (!e) return;
      if (!confirm('هل تريد حذف هذه العملية؟ لا يمكن التراجع عن الحذف.')) return;
      state.entries = state.entries.filter(x => x.id !== e.id);
      persist(); renderAll();
      toast('تم حذف العملية', 'success');
    };
  });
}

        '<div class="goal-stats">' +
          '<span>المُدخر <b>' + money(m.net) + '</b></span>' +

          '<button class="btn danger sm" data-delgoal="' + g.id + '">حذف</button></div></div>';
    }).join('');
  $('#gNew').onclick = () => openGoalForm();
  el.querySelectorAll('[data-activate]').forEach(b => {
    b.onclick = () => { state.activeGoalId = b.dataset.activate; persist(); renderAll(); toast('تم تنشيط الهدف', 'success'); };
  });
  el.querySelectorAll('[data-editgoal]').forEach(b => {
    b.onclick = () => openGoalForm(state.goals.find(g => g.id === b.dataset.editgoal));
  });
  el.querySelectorAll('[data-delgoal]').forEach(b => {
    b.onclick = () => {
      const g = state.goals.find(x => x.id === b.dataset.delgoal);
      if (!g) return;
      const count = state.entries.filter(e => e.goalId === g.id).length;
      if (!confirm('سيتم حذف الهدف «' + g.name + '» مع ' + count + ' عملية مرتبطة به. لا يمكن التراجع. متابعة؟')) return;
      state.goals = state.goals.filter(x => x.id !== g.id);
      state.entries = state.entries.filter(e => e.goalId !== g.id);
      if (state.activeGoalId === g.id) state.activeGoalId = state.goals[0] ? state.goals[0].id : null;
      delete state.settings.milestones[g.id];
      persist(); renderAll();
      toast('تم حذف الهدف', 'success');
    };
  });
}

function statsFilterFn() {
  if (statsScope === 'all') return () => true;
  return e => e.goalId === statsScope;
}

function renderStats() {
  const el = $('#view-stats');
  const filter = statsFilterFn();
  const s = computeStats(filter);
  const list = state.entries.filter(filter);
  const byDay = new Map();
  list.filter(e => e.type === 'work').forEach(e => byDay.set(e.date, (byDay.get(e.date) || 0) + entryAmount(e)));
  let bestDate = null, bestVal = 0;
  byDay.forEach((v, d) => { if (v > bestVal) { bestVal = v; bestDate = d; } });
  const avgPerWorkDay = s.workDays > 0 ? s.earnings / s.workDays : 0;
  const now = new Date();
  const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - now.getDay());
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const weekISO = isoOf(startOfWeek), monthISO = isoOf(startOfMonth);
  const sumRange = (fromISO) => {
    const out = { earnings: 0, expenses: 0, deposits: 0 };
    list.forEach(e => {
      if ((e.date || '') < fromISO) return;
      if (e.type === 'work') out.earnings += entryAmount(e);
      else if (e.type === 'expense') out.expenses += e.amount;
      else out.deposits += e.amount;
    });
    return { ...out, net: out.earnings + out.deposits - out.expenses };
  };
  const week = sumRange(weekISO);
  const month = sumRange(monthISO);
  const goal = (statsScope !== 'all') ? state.goals.find(g => g.id === statsScope) : activeGoal();
  const rate = currentRate();
  const gm = goal ? goalMetrics(goal) : null;
  const neededDays = (gm && rate > 0) ? Math.ceil(gm.remaining / rate) : null;
  const workDates = [...new Set(list.filter(e => e.type === 'work').map(e => e.date))].sort();
  let perWeek = 0;
  if (workDates.length >= 2) {
    const span = Math.max(1, daysBetween(workDates[0], workDates[workDates.length - 1]) + 1);
    perWeek = Math.min(7, Math.max(0.5, workDates.length / (span / 7)));
  } else if (workDates.length === 1) perWeek = 3;
  const scenarioDate = (daysPerWeek) => {
    if (!neededDays || daysPerWeek <= 0) return '—';
    const weeks = neededDays / daysPerWeek;
    const target = new Date();
    target.setDate(target.getDate() + Math.ceil(weeks * 7));
    return dateFmtLong.format(target);
  };
  el.innerHTML =
    '<div class="card"><label class="field">نطاق الإحصائيات' +
        '<select id="statsScope">' +
          '<option value="all"' + (statsScope === 'all' ? ' selected' : '') + '>كل الأهداف</option>' +
          state.goals.map(g => '<option value="' + esc(g.id) + '"' + (statsScope === g.id ? ' selected' : '') + '>' + esc(g.name) + '</option>').join('') +
        '</select></label></div>' +
    '<div class="grid2">' +
      '<div class="card stat"><span class="eyebrow">إجمالي الأرباح</span><strong class="pos">' + money(s.earnings) + '</strong><span class="sub">' + esc(cur()) + '</span></div>' +
      '<div class="card stat"><span class="eyebrow">إجمالي المصروفات</span><strong class="neg">' + money(s.expenses) + '</strong><span class="sub">' + esc(cur()) + '</span></div>' +
      '<div class="card stat"><span class="eyebrow">صافي المدخرات</span><strong>' + money(s.net) + '</strong><span class="sub">' + esc(cur()) + '</span></div>' +
      '<div class="card stat"><span class="eyebrow">عدد أيام العمل</span><strong>' + (Math.round(s.workDays * 100) / 100) + '</strong><span class="sub">يوم</span></div>' +
      '<div class="card stat"><span class="eyebrow">متوسط الربح اليومي</span><strong>' + money(avgPerWorkDay) + '</strong><span class="sub">' + esc(cur()) + ' / يوم عمل</span></div>' +
      '<div class="card stat"><span class="eyebrow">أفضل يوم</span><strong>' + (bestDate ? money(bestVal) : '—') + '</strong><span class="sub">' + (bestDate ? fmtDateShort(bestDate) : 'لا توجد بيانات') + '</span></div>' +
    '</div>' +
    '<div class="card" style="margin-top:12px"><div class="card-title">تطور المدخرات بمرور الوقت</div><div class="chart-wrap"><canvas id="savingsChart"></canvas></div></div>' +
    '<div class="card"><div class="card-title">الملخص الأسبوعي والشهري</div>' +
      '<div class="kv"><span>أرباح هذا الأسبوع</span><b class="pos">' + money(week.earnings) + ' ' + esc(cur()) + '</b></div>' +
      '<div class="kv"><span>مصروفات هذا الأسبوع</span><b class="neg">' + money(week.expenses) + ' ' + esc(cur()) + '</b></div>' +
      '<div class="kv"><span>صافي هذا الأسبوع</span><b>' + money(week.net) + ' ' + esc(cur()) + '</b></div>' +
      '<div class="kv"><span>أرباح هذا الشهر</span><b class="pos">' + money(month.earnings) + ' ' + esc(cur()) + '</b></div>' +
      '<div class="kv"><span>مصروفات هذا الشهر</span><b class="neg">' + money(month.expenses) + ' ' + esc(cur()) + '</b></div>' +
      '<div class="kv"><span>صافي هذا الشهر</span><b>' + money(month.net) + ' ' + esc(cur()) + '</b></div></div>' +
    '<div class="card"><div class="card-title">التوقعات الذكية' + (goal ? ' — ' + esc(goal.name) : '') + '</div>' +
      (goal
        ? '<div class="kv"><span>المبلغ المتبقي</span><b>' + money(gm.remaining) + ' ' + esc(cur()) + '</b></div>' +
          '<div class="kv"><span>سعر اليومية المعتمد</span><b>' + (rate > 0 ? money(rate) + ' ' + esc(cur()) : 'غير محدد') + '</b></div>' +
          '<div class="kv"><span>أيام العمل المطلوبة</span><b>' + (neededDays === null ? '—' : neededDays + ' يوم') + '</b></div>' +
          '<div class="kv"><span>معدل عملك الحالي</span><b>' + (perWeek ? (Math.round(perWeek * 10) / 10) + ' يوم/أسبوع' : 'غير متاح') + '</b></div>' +
          '<div class="kv"><span>التاريخ المتوقع (بمعدلك الحالي)</span><b>' + scenarioDate(perWeek) + '</b></div>' +
          '<div class="kv"><span>لو عملت 3 أيام أسبوعيًا</span><b>' + scenarioDate(3) + '</b></div>' +
          '<div class="kv"><span>لو عملت 4 أيام أسبوعيًا</span><b>' + scenarioDate(4) + '</b></div>' +
          '<div class="kv"><span>لو عملت 5 أيام أسبوعيًا</span><b>' + scenarioDate(5) + '</b></div>' +
          '<div class="kv"><span>متوقع توفيره أسبوعيًا</span><b>' + money(avgPerWorkDay * (perWeek || 3)) + ' ' + esc(cur()) + '</b></div>' +
          '<div class="kv"><span>متوقع توفيره شهريًا</span><b>' + money(avgPerWorkDay * (perWeek || 3) * 4.33) + ' ' + esc(cur()) + '</b></div>' +
          '<div class="notice" style="margin-top:12px">التوقعات تقديرية مبنية على بياناتك الفعلية، وليست مواعيد مضمونة.</div>'
        : '<div class="empty-msg">أنشئ هدفًا لعرض التوقعات.</div>') +
    '</div>' +
    '<div class="card"><div class="card-title">حاسبة سعر اليومية (تجريبية)</div>' +
      '<label class="field">جرّب سعرًا مختلفًا (' + esc(cur()) + ')<input id="calcRate" type="number" step="0.01" min="0" inputmode="decimal" value="' + (rate ? rate / 100 : '') + '" placeholder="250"></label>' +
      '<div class="preview" style="margin-top:10px"><span>عدد الأيام المطلوبة</span><strong id="calcResult">—</strong></div>' +
      '<div class="notice" style="margin-top:10px">هذه الحاسبة لا تغيّر بياناتك الأساسية — للتجربة فقط.</div></div>';
  $('#statsScope').onchange = (ev) => { statsScope = ev.target.value; renderStats(); };
  const calcEl = $('#calcRate');
  const calcOut = $('#calcResult');
  const runCalc = () => {
    const v = Math.round(num(calcEl.value) * 100);
    if (!goal || v <= 0) { calcOut.textContent = '—'; return; }
    const remaining = Math.max(0, goal.target - gm.net);
    calcOut.textContent = Math.ceil(remaining / v) + ' يوم';
  };
  if (calcEl) { calcEl.addEventListener('input', runCalc); runCalc(); }
  requestAnimationFrame(drawChart);
}

function chartData(filterFn) {
  const map = new Map();
  state.entries.filter(filterFn).forEach(e => {
    const d = e.date;
    const v = e.type === 'expense' ? -(e.amount || 0) : entryAmount(e);
    map.set(d, (map.get(d) || 0) + v);
  });
  const dates = [...map.keys()].sort();
  let acc = 0;
  return dates.map(d => { acc += map.get(d); return { date: d, value: acc }; });
}

function drawChart() {
  const canvas = $('#savingsChart');
  if (!canvas) return;
  const wrap = canvas.parentElement;
  const w = Math.max(240, wrap.clientWidth || 300);
  const h = 200;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const cs = getComputedStyle(document.documentElement);
  const primary = cs.getPropertyValue('--primary').trim() || '#10b981';
  const muted   = cs.getPropertyValue('--muted').trim() || '#64748b';
  const border  = cs.getPropertyValue('--border').trim() || '#e2e8f0';
  const data = chartData(statsFilterFn());
  const pad = { t: 16, r: 14, b: 26, l: 14 };
  const cw = w - pad.l - pad.r;
  const ch = h - pad.t - pad.b;
  if (!data.length) {
    ctx.fillStyle = muted; ctx.font = '13px system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('لا توجد بيانات لعرضها بعد', w / 2, h / 2);
    return;
  }
  const values = data.map(d => d.value);
  let min = Math.min(0, ...values);
  let max = Math.max(...values, 1);
  if (max === min) max = min + 1;
  const X = i => pad.l + (data.length === 1 ? cw / 2 : (i / (data.length - 1)) * cw);
  const Y = v => pad.t + ch - ((v - min) / (max - min)) * ch;
  ctx.strokeStyle = border; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  for (let i = 0; i <= 3; i++) {
    const yy = pad.t + (ch / 3) * i;
    ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(pad.l + cw, yy); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(X(0), Y(data[0].value));
  data.forEach((d, i) => ctx.lineTo(X(i), Y(d.value)));
  ctx.lineTo(X(data.length - 1), pad.t + ch);
  ctx.lineTo(X(0), pad.t + ch);
  ctx.closePath();
  ctx.globalAlpha = 0.16; ctx.fillStyle = primary; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath();
  data.forEach((d, i) => { i ? ctx.lineTo(X(i), Y(d.value)) : ctx.moveTo(X(i), Y(d.value)); });
  ctx.strokeStyle = primary; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  const lastX = X(data.length - 1), lastY = Y(data[data.length - 1].value);
  ctx.beginPath(); ctx.arc(lastX, lastY, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = primary; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = cs.getPropertyValue('--card').trim() || '#fff'; ctx.stroke();
  ctx.fillStyle = muted; ctx.font = '11px system-ui,sans-serif';
  ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillText(fmtDateShort(data[0].date), pad.l, h - 18);
  if (data.length > 1) {
    ctx.textAlign = 'right';
    ctx.fillText(fmtDateShort(data[data.length - 1].date), pad.l + cw, h - 18);
  }
  ctx.textAlign = 'right';
  ctx.fillText(money(max), pad.l + cw, 2);
}

  el.innerHTML =

      '<label class="field">الوضع<select id="setTheme">' +
          '<option value="light"' + (s.theme === 'light' ? ' selected' : '') + '>فاتح</option>' +
          '<option value="dark"' + (s.theme === 'dark' ? ' selected' : '') + '>داكن</option>' +
          '<option value="auto"' + (s.theme === 'auto' ? ' selected' : '') + '>تلقائي (حسب النظام)</option>' +
        '</select></label>' +
      '<label class="field">العملة<input id="setCurrency" maxlength="8" value="' + esc(s.currency) + '"></label>' +
      '<label class="field">سعر اليومية الافتراضي (' + esc(s.currency) + ')<input id="setRate" type="number" step="0.01" min="0" inputmode="decimal" value="' + (s.defaultRate ? s.defaultRate / 100 : '') + '" placeholder="250"></label></div>' +
    '<div class="card"><div class="card-title">التذكيرات والإشعارات</div>' +
      '<label class="switch-row"><span>تذكير يومي لتسجيل الأرباح</span><input type="checkbox" id="setReminder"' + (s.reminderEnabled ? ' checked' : '') + '></label>' +
      '<label class="field">وقت التذكير<input type="time" id="setReminderTime" value="' + esc(s.reminderTime || '20:00') + '"></label>' +
      '<button class="btn soft block" id="btnNotifPerm" style="margin-top:6px">' + (notifGranted ? 'إشعارات النظام مفعّلة ✓' : 'تفعيل إشعارات النظام') + '</button>' +
      '<div class="notice" style="margin-top:10px">إشعارات الإنجاز (25% / 50% / 75% / 100%) تعمل تلقائيًا عند تسجيل عملية جديدة.</div></div>' +
    '<div class="card"><div class="card-title">البيانات والنسخ الاحتياطي</div><div class="col">' +
        '<button class="btn ghost block" id="btnExport">⬇️ تصدير نسخة احتياطية (JSON)</button>' +
        '<button class="btn ghost block" id="btnImport">⬆️ استيراد نسخة احتياطية</button>' +
        '<button class="btn ghost block" id="btnCSV">📄 تصدير سجل العمليات (CSV)</button>' +
        '<button class="btn ghost block" id="btnDemo">✨ إضافة بيانات تجريبية</button>' +
        '<button class="btn danger block" id="btnClear">🗑️ مسح كل البيانات</button>' +
      '</div><input type="file" id="fileImport" accept="application/json,.json" hidden>' +
      '<div class="notice" style="margin-top:12px">تُحفظ البيانات محليًا على جهازك فقط (IndexedDB / التخزين المحلي) وتعمل دون إنترنت.</div></div>' +
    '<div class="card"><div class="card-title">عن التطبيق</div>' +
      '<p class="muted small">«هدفي» تطبيق لمتابعة الأهداف المالية وحساب أرباح العمل اليومي وصافي المدخرات. ' +
      'الإصدار 1.0.0 — جميع الحسابات تُنفَّذ بدقة (بالقروش) بدون أخطاء كسور عشرية.</p></div>';
  $('#setTheme').onchange = (ev) => { state.settings.theme = ev.target.value; persist(); applyTheme(); drawChart(); };
  $('#setCurrency').onchange = (ev) => { state.settings.currency = ev.target.value.trim() || 'ج.م'; persist(); renderAll(); };
  $('#setRate').onchange = (ev) => {
    state.settings.defaultRate = Math.max(0, Math.round(num(ev.target.value) * 100));
    persist(); renderAll(); toast('تم حفظ سعر اليومية ✓', 'success');
  };
  $('#setReminder').onchange = (ev) => {
    state.settings.reminderEnabled = ev.target.checked; persist();
    if (ev.target.checked) startReminderLoop();
    toast(ev.target.checked ? 'تم تفعيل التذكير اليومي' : 'تم إيقاف التذكير اليومي');
  };
  $('#setReminderTime').onchange = (ev) => {
    state.settings.reminderTime = ev.target.value || '20:00';
    state.settings.lastReminderDate = null; persist();
  };
  $('#btnNotifPerm').onclick = async () => {
    if (!notifSupported) { toast('الإشعارات غير مدعومة', 'error'); return; }
    if (Notification.permission === 'granted') { toast('الإشعارات مفعّلة بالفعل'); return; }
    const p = await Notification.requestPermission();
    toast(p === 'granted' ? 'تم تفعيل الإشعارات ✓' : 'لم يتم السماح بالإشعارات', p === 'granted' ? 'success' : 'error');
    renderSettings();
  };
  $('#btnExport').onclick = exportJSON;
  $('#btnImport').onclick = () => $('#fileImport').click();
  $('#fileImport').onchange = importJSON;
  $('#btnCSV').onclick = exportCSV;
  $('#btnDemo').onclick = () => {
    if (state.goals.length && !confirm('سيتم إضافة بيانات تجريبية إلى بياناتك الحالية. متابعة؟')) return;
    loadDemo();
  };
  $('#btnClear').onclick = () => {
    if (!confirm('سيتم مسح جميع الأهداف والعمليات نهائيًا. متأكد؟')) return;
    if (!confirm('تأكيد أخير: لا يمكن استرجاع البيانات إلا من نسخة احتياطية.')) return;
    state = defaultState(); persistNow();
    applyTheme(); renderAll();
    toast('تم مسح جميع البيانات', 'success');
  };
}

function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 600);
}

function exportJSON() {
  const payload = JSON.stringify(state, null, 2);
  download(new Blob([payload], { type: 'application/json;charset=utf-8' }), 'hadafi-backup-' + todayISO() + '.json');
  toast('تم تصدير النسخة الاحتياطية ✓', 'success');
}

async function importJSON(ev) {
  const file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.goals) || !Array.isArray(data.entries)) throw new Error('bad format');
    if (!confirm('سيتم استبدال جميع بياناتك الحالية بمحتوى الملف. متابعة؟')) return;
    state = migrate(data);
    await persistNow();
    applyTheme(); renderAll();
    toast('تم استيراد البيانات بنجاح ✓', 'success');
  } catch (e) { toast('ملف غير صالح أو تالف', 'error'); }
}

function exportCSV() {
  const rows = [['التاريخ', 'النوع', 'الهدف', 'التفاصيل', 'المبلغ', 'ملاحظات']];
  const sorted = state.entries.slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  sorted.forEach(e => {
    const goal = state.goals.find(g => g.id === e.goalId);
    let type = '', details = '';
    if (e.type === 'work') { type = 'عمل'; details = money(e.rate) + ' × ' + e.days + (e.bonus ? ' + مكافأة ' + money(e.bonus) : ''); }
    else if (e.type === 'expense') { type = 'مصروف'; details = catOf(e.category).label; }
    else { type = 'إيداع'; details = 'إيداع إضافي'; }
    const sign = e.type === 'expense' ? '-' : '+';
    rows.push([e.date, type, goal ? goal.name : '—', details, sign + money(entryAmount(e)), e.note || '']);
  });
  const csv = '\uFEFF' + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  download(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'hadafi-history-' + todayISO() + '.csv');
  toast('تم تصدير السجل إلى CSV ✓', 'success');
}

function loadDemo() {
  const goalId = uid();
  const goal = { id: goalId, name: 'شراء لابتوب', target: 250000, deadline: null, createdAt: Date.now() };
  const today = new Date();
  const entries = [];
  let d = new Date(today); d.setDate(d.getDate() - 6);
  for (let i = 0; i < 5; i++) {
    entries.push({ id: uid(), type: 'work', goalId, date: isoOf(d), rate: 25000, days: 1, bonus: 0, note: 'يوم عمل تجريبي', createdAt: Date.now() + i, updatedAt: Date.now() + i });
    d.setDate(d.getDate() + 1);
  }
  const expDate = new Date(today); expDate.setDate(expDate.getDate() - 2);
  entries.push({ id: uid(), type: 'expense', goalId, date: isoOf(expDate), amount: 25000, category: 'food', note: 'مصروف تجريبي', createdAt: Date.now() + 10, updatedAt: Date.now() + 10 });
  state.goals.push(goal);
  state.entries.push(...entries);
  if (!state.activeGoalId) state.activeGoalId = goalId;
  if (!state.settings.defaultRate) state.settings.defaultRate = 25000;
  persist(); renderAll();
  toast('تمت إضافة بيانات تجريبية: أرباح 1250، مصروف 250، صافي 1000، إنجاز 40%', 'success');
}

function applyTheme() {
  let t = state.settings.theme || 'light';
  if (t === 'auto') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.dataset.theme = t;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0a1120' : '#10b981');
  const btn = $('#themeBtn');
  if (btn) btn.innerHTML = t === 'dark' ? ICON.sun : ICON.moon;
}

const VIEWS = [
  { id: 'home',     label: 'الرئيسية', icon: ICON.home },
  { id: 'history',  label: 'السجل',    icon: ICON.history },
  { id: 'goals',    label: 'الأهداف',  icon: ICON.goals },
  { id: 'stats',    label: 'الإحصاء',  icon: ICON.stats },
  { id: 'settings', label: 'الإعدادات', icon: ICON.settings }
];

function buildNav() {
  $('#bottomNav').innerHTML = VIEWS.map(v => '<button class="nav-item' + (v.id === 'home' ? ' active' : '') + '" data-view="' + v.id + '">' + v.icon + '<span>' + v.label + '</span></button>').join('');
  $$('.nav-item').forEach(b => b.onclick = () => go(b.dataset.view));
}

function go(view) {
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + view));
  $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (view === 'stats') requestAnimationFrame(drawChart);
}

let reminderTimer = null;
function startReminderLoop() {
  clearInterval(reminderTimer);
  if (!state.settings.reminderEnabled) return;
  reminderTimer = setInterval(checkReminder, 30000);
  checkReminder();
}
function checkReminder() {
  const s = state.settings;
  if (!s.reminderEnabled) return;
  const now = new Date();
  const [hh, mm] = String(s.reminderTime || '20:00').split(':').map(Number);
  const today = todayISO();
  if (s.lastReminderDate === today) return;
  if (now.getHours() > hh || (now.getHours() === hh && now.getMinutes() >= mm)) {
    s.lastReminderDate = today; persist();
    const loggedToday = state.entries.some(e => e.type === 'work' && e.date === today);
    if (!loggedToday) notify('تذكير هدفي 🎯', 'لم تسجّل أرباح اليوم بعد — سجّلها الآن لمتابعة تقدمك نحو هدفك.');
  }
}

function renderAll() {
  renderHome();
  renderGoals();
  renderHistory();
  renderStats();
  renderSettings();
}

async function init() {
  try {
    const saved = await Store.get('state');
    state = saved ? migrate(saved) : defaultState();
  } catch (e) { state = defaultState(); }
  buildNav();
  applyTheme();
  renderAll();
  $('#themeBtn').onclick = () => {
    const current = document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    state.settings.theme = current === 'dark' ? 'light' : 'dark';
    persist(); applyTheme(); drawChart();
  };
  $('#fab').onclick = openQuickSheet;
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawChart, 180); });
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const handler = () => { if (state.settings.theme === 'auto') { applyTheme(); drawChart(); } };
    if (mq.addEventListener) mq.addEventListener('change', handler);
    else if (mq.addListener) mq.addListener(handler);
  }
  window.addEventListener('pagehide', persistNow);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') persistNow(); });
  startReminderLoop();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
  document.body.style.opacity = '1';
}

document.addEventListener('DOMContentLoaded', init);
</script>
